name: ci

# push master / PR 的常规检查。发版走 build-windows.yml（tag 触发），两边职责不重叠：
# 这里比 verify job 多两道只有本仓自己立的红线 —— bundle 预算（check:bundle）
# 与构建本身；它们此前只在本地手动跑，README 承诺的 gzip ≤ 950KB 从未被 CI 盯住。
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  # 同一分支只保留最新提交，避免旧提交继续占用完整构建矩阵。
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 build-windows.yml 保持同一版本（本地 24.18.0 上全绿）
  NODE_VERSION: '24'

jobs:
  ci:
    name: 检查（类型 / i18n / 测试 / 构建 / 预算）
    # 用 windows-latest：集成测试的 fixture 与源码里的 win32 分支只有在 Windows 上才真被执行，
    # 而 Windows 恰好是本项目唯一的交付平台
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      OFS_POSIX_SH_TIMEOUT_MS: '20000'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run check:i18n

      # 集成测试起本地 fixture SSH 服务；真机验收用例无 OFS_TEST_* 时自动跳过。
      # Windows 上的三个真 POSIX shell 测试不能与其他测试文件并发启动 MSYS sh。
      - name: npm test（Windows 串行 shell）
        run: npm test -- --no-file-parallelism --maxWorkers=1 --testTimeout=120000 --reporter=dot

      - name: 收集 Windows 测试环境诊断
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'openfinalshell-windows-test-diagnostics'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          node --version | Out-File (Join-Path $dir 'runtime.txt') -Encoding utf8
          npm --version | Out-File (Join-Path $dir 'runtime.txt') -Append -Encoding utf8
          git --version | Out-File (Join-Path $dir 'runtime.txt') -Append -Encoding utf8
          $sh = Get-Command sh.exe -ErrorAction SilentlyContinue
          if ($sh) {
            "sh=$($sh.Source)" | Out-File (Join-Path $dir 'runtime.txt') -Append -Encoding utf8
            & $sh.Source --version 2>&1 | Out-File (Join-Path $dir 'runtime.txt') -Append -Encoding utf8
          }
          Get-Process sh,bash,tar,find,du,df -ErrorAction SilentlyContinue |
            Select-Object Id,ProcessName,Path,StartTime,CPU |
            Format-List | Out-File (Join-Path $dir 'processes.txt') -Encoding utf8
          Get-ChildItem Env: |
            Where-Object { $_.Name -in @('CI', 'RUNNER_OS', 'RUNNER_TEMP', 'TEMP', 'TMP', 'PATH', 'OFS_POSIX_SH_TIMEOUT_MS') } |
            Sort-Object Name | Format-Table -AutoSize |
            Out-File (Join-Path $dir 'environment.txt') -Encoding utf8
          Get-ChildItem $env:TEMP -Filter 'ofs-*' -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,LastWriteTime |
            Format-Table -AutoSize | Out-File (Join-Path $dir 'temporary-files.txt') -Encoding utf8

      - name: 上传 Windows 测试诊断
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/openfinalshell-windows-test-diagnostics
          if-no-files-found: warn
          retention-days: 7

      # check:bundle 读 out/ 的产物算 gzip，必须先 build
      - run: npm run build
      - run: npm run check:bundle


  linux:
    name: Linux ${{ matrix.arch }}（构建 / deb）
    runs-on: ${{ matrix.runner }}
    container: debian:13
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: 安装构建依赖
        run: |
          apt-get update
          # openssh-client 提供私钥格式测试使用的 ssh-keygen。
          apt-get install -y --no-install-recommends ca-certificates git tar xz-utils dpkg-dev openssh-client python3 build-essential

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Windows job 已执行完整类型、i18n 和测试门禁；Linux job 只负责
      # Linux 原生打包和产物校验，避免在两个架构上重复跑全量测试。
      - run: npm run build
      - run: npm run check:bundle
      - run: npx electron-builder --linux deb --${{ matrix.arch }} --publish never
      - run: npm run check:deb -- ${{ matrix.arch }}
