name: desktop-release

# 打 v* tag → 构建并发布 Release；手动触发只产出 artifact 不发 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 发 Release 需要写权限（GITHUB_TOKEN 默认只读）
permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本地开发环境一致（本地 24.18.0 上全绿）
  NODE_VERSION: '24'

jobs:
  verify:
    name: 检查（类型 / i18n / 测试）
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Git for Windows 的 MSYS shell 在 hosted runner 高负载时启动较慢；
      # 由 test/posixSh.ts 负责在这个边界内终止卡住的子进程并输出诊断。
      OFS_POSIX_SH_TIMEOUT_MS: '20000'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # tag 与 package.json 的版本必须一致：产物文件名取自 package.json，
      # 对不上会发出一个"v0.2.0 的 Release 里装着 0.1.0 的安装包"。
      # 放在打包之前，省得白跑十几分钟才发现。
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          echo "package.json=$pkg  tag=$tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $pkg 不一致，请先改 package.json 再重新打 tag"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run check:i18n

      # 集成测试会起本地 fixture SSH 服务；真机验收用例无 OFS_TEST_* 时自动跳过。
      # Windows 上的三个真 POSIX shell 测试不能与其他测试文件并发启动 MSYS sh。
      - name: npm test（Windows 串行 shell）
        run: npm test -- --no-file-parallelism --maxWorkers=1 --testTimeout=120000 --reporter=dot

      - name: 收集 Windows 测试环境诊断
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'openfinalshell-windows-test-diagnostics'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          node --version | Out-File (Join-Path $dir 'runtime.txt') -Encoding utf8
          npm --version | Out-File (Join-Path $dir 'runtime.txt') -Append -Encoding utf8
          git --version | Out-File (Join-Path $dir 'runtime.txt') -Append -Encoding utf8
          $sh = Get-Command sh.exe -ErrorAction SilentlyContinue
          if ($sh) {
            "sh=$($sh.Source)" | Out-File (Join-Path $dir 'runtime.txt') -Append -Encoding utf8
            & $sh.Source --version 2>&1 | Out-File (Join-Path $dir 'runtime.txt') -Append -Encoding utf8
          }
          Get-Process sh,bash,tar,find,du,df -ErrorAction SilentlyContinue |
            Select-Object Id,ProcessName,Path,StartTime,CPU |
            Format-List | Out-File (Join-Path $dir 'processes.txt') -Encoding utf8
          Get-ChildItem Env: |
            Where-Object { $_.Name -in @('CI', 'RUNNER_OS', 'RUNNER_TEMP', 'TEMP', 'TMP', 'PATH', 'OFS_POSIX_SH_TIMEOUT_MS') } |
            Sort-Object Name | Format-Table -AutoSize |
            Out-File (Join-Path $dir 'environment.txt') -Encoding utf8
          Get-ChildItem $env:TEMP -Filter 'ofs-*' -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,LastWriteTime |
            Format-Table -AutoSize | Out-File (Join-Path $dir 'temporary-files.txt') -Encoding utf8

      - name: 上传 Windows 测试诊断
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/openfinalshell-windows-test-diagnostics
          if-no-files-found: warn
          retention-days: 7

  build:
    name: 打包 ${{ matrix.arch }}
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # ia32 即 32 位（x86）；Electron 43 同时提供 win32 x64 / ia32 / arm64 产物。
        arch: [x64, ia32, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Electron 二进制每个架构约 100MB，缓存掉省下载时间
      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.arch }}-

      - run: npm ci

      - name: 安装 FreeRDP SDK（Windows x64）
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = 'C:\vcpkg' }
          $vcpkg = Join-Path $vcpkgRoot 'vcpkg.exe'
          $toolchain = Join-Path $vcpkgRoot 'scripts\buildsystems\vcpkg.cmake'
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            Write-Error "BLOCKED_EXTERNAL_ENV: vcpkg.exe was not found at $vcpkg"
            exit 1
          }
          if (-not (Test-Path -LiteralPath $toolchain)) {
            Write-Error "BLOCKED_EXTERNAL_ENV: vcpkg CMake toolchain was not found at $toolchain"
            exit 1
          }
          & "$vcpkgRoot\vcpkg.exe" install freerdp:x64-windows
          if ($LASTEXITCODE -ne 0) {
            Write-Error "BLOCKED_EXTERNAL_ENV: vcpkg could not install freerdp:x64-windows (exit $LASTEXITCODE)"
            exit $LASTEXITCODE
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_TOOLCHAIN_FILE=$vcpkgRoot\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_PREFIX_PATH=$vcpkgRoot\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$vcpkgRoot\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 构建 RDP Worker（${{ matrix.arch }}）
        shell: pwsh
        run: |
          if ('${{ matrix.arch }}' -eq 'x64') {
            cmake --version
            npm run build:rdp-worker -- --platform win --arch x64 --require-freerdp
            npm run check:rdp-worker -- --platform win --arch x64 --require-freerdp
          } else {
            npm run build:rdp-worker -- --platform win --arch ${{ matrix.arch }} --package-disabled
            npm run check:rdp-worker -- --platform win --arch ${{ matrix.arch }} --expect-absent
          }

      - name: 真实 RDP Worker 冒烟（Windows x64，可无环境跳过）
        if: matrix.arch == 'x64'
        env:
          OFS_TEST_RDP_HOST: ${{ secrets.OFS_TEST_RDP_HOST }}
          OFS_TEST_RDP_PORT: ${{ secrets.OFS_TEST_RDP_PORT }}
          OFS_TEST_RDP_USERNAME: ${{ secrets.OFS_TEST_RDP_USERNAME }}
          OFS_TEST_RDP_PASSWORD: ${{ secrets.OFS_TEST_RDP_PASSWORD }}
          OFS_TEST_RDP_DOMAIN: ${{ secrets.OFS_TEST_RDP_DOMAIN }}
          OFS_TEST_RDP_EXPECT_CERT_PROMPT: ${{ secrets.OFS_TEST_RDP_EXPECT_CERT_PROMPT }}
          OFS_TEST_RDP_CERT_REJECT: ${{ secrets.OFS_TEST_RDP_CERT_REJECT }}
        run: npm run smoke:rdp-worker -- build/rdp-worker/ofs-rdp-worker.exe

      - run: npm run build

      # 必须显式指定单一架构：一次同时给两个架构时，electron-builder 会额外产出一个
      # 双架构合体安装包（181MB vs 单架构 86/96MB），这里不需要。
      # --publish never：产物统一由下面的 release job 上传，不让 electron-builder 自己去建草稿 Release。
      - name: electron-builder (${{ matrix.arch }})
        run: npx electron-builder --win --${{ matrix.arch }} --publish never

      # 每个 job 只该出本架构的 2 个 exe（安装版 + 免安装）。
      # 多出来通常意味着 electron-builder.yml 里又给 win.target 写死了 arch ——
      # 那样命令行的架构标志会被忽略，两个架构外加合体包全建一遍。
      - name: 断言产物只有本架构的两个 exe
        shell: bash
        run: |
          files=$(cd release && ls *.exe | sort)
          echo "$files"
          count=$(echo "$files" | grep -c . || true)
          if [ "$count" -ne 2 ]; then
            echo "::error::期望 2 个 exe，实际 $count 个"
            exit 1
          fi
          for f in $files; do
            case "$f" in
              *-${{ matrix.arch }}.exe) ;;
              *) echo "::error::产物 $f 不属于架构 ${{ matrix.arch }}"; exit 1 ;;
            esac
          done

      # 自动更新的元数据。这几条断言比阈值本身重要：
      # feed 静默指错架构、或者压根没产出，界面上都毫无症状 —— 用户只是永远收不到更新。
      - name: 断言 update feed 与 blockmap
        shell: bash
        run: |
          cd release
          arch=${{ matrix.arch }}
          ver=$(node -p "require('../package.json').version")
          setup="OpenFinalShell-$ver-setup-$arch.exe"

          # ① 裸 latest.yml 出现 = electron-builder.yml 的 publish.channel 丢了。
          #    那意味着两个架构的 job 会在 Release 里互相覆盖（静默）。
          if [ -e latest.yml ]; then
            echo "::error::出现裸 latest.yml —— publish.channel: latest-\${arch} 没生效"
            exit 1
          fi
          n=$(ls latest-*.yml 2>/dev/null | wc -l)
          if [ "$n" -ne 1 ] || [ ! -f "latest-$arch.yml" ]; then
            echo "::error::期望恰好一份 latest-$arch.yml，实际 $n 份：$(ls latest-*.yml 2>/dev/null)"
            exit 1
          fi

          # ② feed 只能指向本架构的安装包，且只有一条 file 条目（免安装版不进 feed）
          if ! grep -q "url: $setup" "latest-$arch.yml"; then
            echo "::error::latest-$arch.yml 的 url 不是 $setup"; cat "latest-$arch.yml"; exit 1
          fi
          files=$(grep -c '^  - url:' "latest-$arch.yml")
          if [ "$files" -ne 1 ]; then
            echo "::error::latest-$arch.yml 有 $files 条 file 条目，应为 1"; cat "latest-$arch.yml"; exit 1
          fi
          if grep -q 'portable' "latest-$arch.yml"; then
            echo "::error::免安装版不该进 feed（它装不了，也没有 blockmap）"; exit 1
          fi

          # ③ sha512 必须与实际文件对得上 —— 差量与全量下载都靠它校验，
          #    对不上的话客户端下完才失败，而 CI 这里是能提前发现的
          want=$(grep -m1 'sha512:' "latest-$arch.yml" | sed 's/.*sha512: //')
          got=$(openssl dgst -sha512 -binary "$setup" | openssl base64 -A)
          if [ "$want" != "$got" ]; then
            echo "::error::sha512 不匹配：feed=$want 实际=$got"; exit 1
          fi

          # ④ 差量下载的前提：安装包的 blockmap 在，且只有一个
          b=$(ls *.blockmap 2>/dev/null | wc -l)
          if [ "$b" -ne 1 ] || [ ! -f "$setup.blockmap" ]; then
            echo "::error::期望恰好 1 个 $setup.blockmap，实际 $b 个：$(ls *.blockmap 2>/dev/null)"
            exit 1
          fi
          cat "latest-$arch.yml"

      - name: 断言解包目录的 RDP Worker 发布边界
        shell: pwsh
        run: |
          $unpacked = if ('${{ matrix.arch }}' -eq 'x64') { 'release/win-unpacked' } else { 'release/win-${{ matrix.arch }}-unpacked' }
          if ('${{ matrix.arch }}' -eq 'x64') {
            npm run check:rdp-worker -- --platform win --arch x64 --app-dir $unpacked --require-freerdp
          } else {
            npm run check:rdp-worker -- --platform win --arch ${{ matrix.arch }} --app-dir $unpacked --expect-absent
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          # 除了 exe，自动更新还要 feed 与 blockmap。少了它们客户端根本查不到新版本，
          # 而这两样此前一直被生成、又一直被丢掉。
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest-*.yml
          if-no-files-found: error
          retention-days: 14

  build-mac:
    name: 打包 macOS ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 使用 Intel runner，arm64/universal 使用 Apple Silicon runner。
          - arch: x64
            # macos-13 runner 已长期排队/不可用；macos-14 可交叉打包 x64。
            runner: macos-14
          - arch: arm64
            runner: macos-14
          - arch: universal
            runner: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.arch }}-

      - run: npm ci
      - name: 禁用尚未移植的 RDP Worker（macOS ${{ matrix.arch }}）
        run: |
          npm run build:rdp-worker -- --platform mac --arch ${{ matrix.arch }} --package-disabled
          npm run check:rdp-worker -- --platform mac --arch ${{ matrix.arch }} --expect-absent
      - run: npm run build

      - name: electron-builder (macOS ${{ matrix.arch }})
        env:
          # 当前发布包不配置签名证书；关闭自动发现，避免访问不存在的钥匙串。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >-
          npx electron-builder --mac --${{ matrix.arch }} --publish never
          ${{ matrix.arch == 'universal' && '--config.publish.channel=latest-universal' || '' }}

      - name: 断言 macOS 产物
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::期望 1 个 DMG，实际 ${#dmgs[@]} 个"; exit 1; }
          [ "${#zips[@]}" -eq 1 ] || { echo "::error::期望 1 个 ZIP，实际 ${#zips[@]} 个"; exit 1; }
          if [ "${{ matrix.arch }}" = "x64" ]; then
            # electron-builder 的默认 x64 artifactName 不带架构后缀。
            case "$(basename "${dmgs[0]}")" in
              OpenFinalShell-*.dmg) ;;
              *) echo "::error::DMG 架构不匹配"; exit 1 ;;
            esac
            case "$(basename "${zips[0]}")" in
              OpenFinalShell-*-mac.zip) ;;
              *) echo "::error::ZIP 架构不匹配"; exit 1 ;;
            esac
          else
            case "$(basename "${dmgs[0]}")" in *-${{ matrix.arch }}.dmg) ;; *) echo "::error::DMG 架构不匹配"; exit 1 ;; esac
            case "$(basename "${zips[0]}")" in *-${{ matrix.arch }}-mac.zip) ;; *) echo "::error::ZIP 架构不匹配"; exit 1 ;; esac
          fi
          ls -lh "${dmgs[@]}" "${zips[@]}"

      - name: 断言解包目录不含 mock RDP Worker
        run: |
          unpacked="release/mac-${{ matrix.arch }}/OpenFinalShell.app"
          if [ "${{ matrix.arch }}" = "x64" ]; then
            unpacked="release/mac/OpenFinalShell.app"
          fi
          npm run check:rdp-worker -- --platform mac --arch ${{ matrix.arch }} --app-dir "$unpacked" --expect-absent

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: 打包 Linux ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    container: debian:13
    strategy:
      fail-fast: false
      matrix:
        include:
          # ARM64 必须在原生 ARM64 runner 上打包与冒烟；QEMU 只适合辅助排错，不能当发布验证。
          - arch: x64
            runner: ubuntu-latest
            deb_arch: amd64
            smoke: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            smoke: true
          - arch: armv7l
            # GitHub 没有原生 armv7l runner；electron-builder 可下载对应
            # Electron 运行时并在 x64 runner 上交叉打包，不能在此架构上运行冒烟。
            runner: ubuntu-latest
            deb_arch: armhf
            smoke: false
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Linux 构建、打包与 GUI 冒烟依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git tar xz-utils dpkg-dev openssl openssh-client passwd util-linux python3 build-essential cmake \
            xvfb xauth dbus-x11 procps rpm
          if [ "${{ matrix.arch }}" = "armv7l" ]; then
            apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: 禁用尚未移植的 RDP Worker（Linux ${{ matrix.arch }}）
        run: |
          npm run build:rdp-worker -- --platform linux --arch ${{ matrix.arch }} --package-disabled
          npm run check:rdp-worker -- --platform linux --arch ${{ matrix.arch }} --expect-absent

      # verify job 已执行完整类型、i18n 和测试门禁；本 job 只负责
      # Linux 原生打包、产物校验和安装冒烟，避免每个架构重复跑全量测试。
      - run: npm run build
      - run: npx electron-builder --linux deb rpm AppImage --${{ matrix.arch }} --publish never
      - run: npm run check:deb -- ${{ matrix.arch }}
      - run: npm run check:linux-artifacts -- ${{ matrix.arch }} deb rpm appImage
      - name: 断言解包目录不含 mock RDP Worker
        run: |
          unpacked="release/linux-${{ matrix.arch }}-unpacked"
          if [ "${{ matrix.arch }}" = "x64" ]; then
            unpacked="release/linux-unpacked"
          fi
          npm run check:rdp-worker -- --platform linux --arch ${{ matrix.arch }} --app-dir "$unpacked" --expect-absent

      - name: 用 APT 安装并运行打包产物冒烟
        if: matrix.smoke
        run: |
          apt-get install -y ./release/*-debian13-${{ matrix.deb_arch }}.deb
          useradd --create-home --shell /bin/bash ofs-ci
          runuser -u ofs-ci -- env HOME=/home/ofs-ci PATH="$PATH" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -c '
            runtime=/tmp/ofs-runtime-$(id -u)
            mkdir -p "$runtime"
            chmod 700 "$runtime"
            export XDG_RUNTIME_DIR="$runtime"
            cd "$GITHUB_WORKSPACE"
            node test/fixtures/testSshServer.mjs 2270 > /tmp/ofs-ssh-fixture.log 2>&1 &
            fixture=$!
            trap "kill $fixture 2>/dev/null || true" EXIT
            for i in $(seq 1 40); do
              kill -0 $fixture 2>/dev/null || { cat /tmp/ofs-ssh-fixture.log; exit 1; }
              node -e "const s=require(\"node:net\").connect(2270,\"127.0.0.1\",()=>{s.end();process.exit(0)});s.on(\"error\",()=>process.exit(1))" && break
              sleep 0.25
              [ "$i" -lt 40 ] || { cat /tmp/ofs-ssh-fixture.log; exit 1; }
            done
            OFS_SMOKE_NO_SANDBOX=1 dbus-run-session -- xvfb-run -a node test/fixtures/packagedSmoke.mjs \
              /opt/OpenFinalShell/openfinalshell 2270 9333
          '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14

  build-flatpak:
    # Flathub 的 Electron BaseApp 目前只发布 x86_64；Linux ARM64 仍由
    # deb、rpm 与 AppImage 正式覆盖，不能产出一个无法安装的 ARM64 Flatpak。
    name: 打包 Flatpak x64
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # electron-builder 的 Flatpak 目标需要可正常运行的系统 Flatpak 服务；
      # Debian Docker container 内缺少该运行环境，构建会在 flatpak 阶段失败。
      - name: 安装 Flatpak 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder cmake
          # flatpak-bundler 按 runtime/<id>/<arch>/<branch> 安装依赖，
          # 新 runner 默认没有用户级远程仓库，必须先提供 Flathub。
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: 禁用尚未移植的 RDP Worker（Linux x64 Flatpak）
        run: |
          npm run build:rdp-worker -- --platform linux --arch x64 --package-disabled
          npm run check:rdp-worker -- --platform linux --arch x64 --expect-absent
      - run: npm run build
      - name: electron-builder (flatpak x64)
        env:
          # flatpak-bundler 默认吞掉子进程 stderr；保留命令日志以便发布失败时可诊断。
          DEBUG: flatpak-bundler
        run: npx electron-builder --linux flatpak --x64 --publish never
      - run: npm run check:linux-artifacts -- x64 flatpak
      - name: 断言解包目录不含 mock RDP Worker
        run: npm run check:rdp-worker -- --platform linux --arch x64 --app-dir release/linux-unpacked --expect-absent

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-x64
          path: release/*.flatpak
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    needs: [build, build-mac, build-linux, build-flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      # download-artifact 的 merge-multiple 会让同名文件后写的赢（静默）。
      # 上一步的 per-arch 断言看不到这一层，所以合并后必须再断一次。
      - name: 断言合并后的产物集合
        run: |
          cd dist
          ls -l
          count() { find . -maxdepth 1 -type f -name "$1" | wc -l; }
          [ "$(count '*.exe')" -eq 6 ] || { echo "::error::期望 6 个 exe"; exit 1; }
          [ "$(count '*.exe.blockmap')" -eq 3 ] || { echo "::error::期望 3 个 blockmap"; exit 1; }
          [ "$(count '*.deb')" -eq 3 ] || { echo "::error::期望 3 个 Debian 包"; exit 1; }
          [ "$(count '*.rpm')" -eq 3 ] || { echo "::error::期望 3 个 RPM 包"; exit 1; }
          [ "$(count '*.AppImage')" -eq 3 ] || { echo "::error::期望 3 个 AppImage"; exit 1; }
          [ "$(count '*.flatpak')" -eq 1 ] || { echo "::error::期望 1 个 x64 Flatpak 包"; exit 1; }
          [ "$(count '*.dmg')" -eq 3 ] || { echo "::error::期望 3 个 macOS DMG"; exit 1; }
          [ "$(count '*.zip')" -eq 3 ] || { echo "::error::期望 3 个 macOS ZIP"; exit 1; }
          test -f latest-x64.yml || { echo "::error::缺 latest-x64.yml"; exit 1; }
          test -f latest-ia32.yml || { echo "::error::缺 latest-ia32.yml"; exit 1; }
          test -f latest-arm64.yml || { echo "::error::缺 latest-arm64.yml"; exit 1; }
          [ "$(count 'latest-*.yml')" -eq 3 ] || { echo "::error::期望 3 个 Windows 架构专属更新 feed"; exit 1; }
          if [ -e latest.yml ]; then
            echo "::error::出现裸 latest.yml —— 多架构 feed 会互相覆盖"; exit 1
          fi
          # Windows 三份 feed 必须各自指向自己的架构，交叉了就会装错包。
          grep -q 'setup-x64.exe' latest-x64.yml || { echo "::error::latest-x64.yml 没指向 x64 包"; exit 1; }
          grep -q 'setup-ia32.exe' latest-ia32.yml || { echo "::error::latest-ia32.yml 没指向 ia32 包"; exit 1; }
          grep -q 'setup-arm64.exe' latest-arm64.yml || { echo "::error::latest-arm64.yml 没指向 arm64 包"; exit 1; }
          grep -H 'url:' latest-*.yml

      # 安装包没有代码签名，校验和是用户确认完整性的唯一手段
      - name: 生成校验和
        run: |
          cd dist
          sha256sum *.exe *.deb *.rpm *.AppImage *.flatpak *.dmg *.zip | tee SHA256SUMS.txt
          ls -lh

      - name: 创建 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          ### 下载

          | 文件 | 说明 |
          |---|---|
          | `*-setup-x64.exe` | 64 位安装版（推荐） |
          | `*-setup-ia32.exe` | 32 位（x86）安装版 |
          | `*-setup-arm64.exe` | Windows ARM64 安装版 |
          | `*-portable-x64.exe` | 64 位免安装 |
          | `*-portable-ia32.exe` | 32 位（x86）免安装 |
          | `*-portable-arm64.exe` | Windows ARM64 免安装 |
          | `*-debian13-amd64.deb` / `*-debian13-arm64.deb` | Debian 13 安装包 |
          | `*-linux-x86_64.rpm` / `*-linux-aarch64.rpm` / `*-linux-armv7l.rpm` | Fedora / RHEL / openSUSE 安装包 |
          | `*-linux-x86_64.AppImage` / `*-linux-arm64.AppImage` / `*-linux-armv7l.AppImage` | 通用免安装 Linux 包 |
          | `*-linux-x86_64.flatpak` | x64 Linux 的 Flatpak 安装包 |
          | `*-linux-armv7l.deb` | Debian ARMv7/armhf 安装包 |
          | `*-x64.dmg` / `*-arm64.dmg` / `*-universal.dmg` | macOS 安装镜像 |
          | `*-x64.zip` / `*-arm64.zip` / `*-universal.zip` | macOS 免安装压缩包 |
          | `*-android-*.apk` | Android APK（按 ABI 提供，含 universal 版） |
          | `*-android.aab` | Android App Bundle（用于应用商店发布） |
          | `SHA256SUMS-android.txt` | Android APK/AAB 校验和 |

          Windows 安装版免管理员权限，默认装到 `%LOCALAPPDATA%`，可改安装目录。

          Debian 13 使用 `sudo apt install ./OpenFinalShell-<版本>-debian13-amd64.deb`（或 `arm64.deb` / `armv7l.deb`）安装或覆盖升级。
          Linux 版只提示新版本，不在应用内提权安装。

          > `latest-*.yml` 与 `*.blockmap` 是更新检查元数据，不用手工下载。
          > 其中 blockmap 让下一版只下载变化的部分，所以历史版本的这两个文件不会删。

          > 安装包**未做代码签名**，首次运行 Windows SmartScreen 可能提示"未知发布者"，
          > 点"更多信息 → 仍要运行"即可。可用 `SHA256SUMS.txt` 校验文件完整性。

          ### 升级前请注意

          > **Windows 安装版卸载会清空本机数据。** 卸载前请先用「设置 → 安全与数据 → 导出」备份。
          > Linux 覆盖升级和卸载会保留 `~/.config/OpenFinalShell`。

          > **首次启动会把旧的 JSON 配置迁进 SQLite**（`userData/config/openfinalshell.db`），
          > 原文件改名 `*.migrated` 保留不删，映射有偏差还能人工找回。

          > 凭据加密走 Windows DPAPI，密文与当前系统账户绑定，换机或重装系统后解不开。
          > 迁移走「导出并勾选含密码」→ 新机「选择文件导入…」填同一口令：
          > 那一段是用导出口令重新加密的，不依赖 DPAPI。
          EOF
          prerelease=()
          # v0.1.0-rc1 这类带后缀的 tag 视为预发布
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "更新现有 Release $GITHUB_REF_NAME（保留 Android 资产）"
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OpenFinalShell $GITHUB_REF_NAME" \
              --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OpenFinalShell $GITHUB_REF_NAME" \
              --notes-file notes.md \
              --verify-tag \
              "${prerelease[@]}"
          fi

          # 只清理桌面资产，保留 Android 工作流可能已经上传的 APK/AAB。
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              case "$asset" in
                *.exe|*.exe.blockmap|*.deb|*.rpm|*.AppImage|*.flatpak|*.dmg|*.zip|latest-*.yml|SHA256SUMS.txt)
                  gh release delete-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --yes
                  ;;
              esac
            done

          gh release upload "$GITHUB_REF_NAME" \
            dist/*.exe dist/*.exe.blockmap dist/*.deb dist/*.rpm dist/*.AppImage dist/*.flatpak dist/*.dmg dist/*.zip dist/latest-*.yml dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
