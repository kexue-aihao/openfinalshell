name: android

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "shared-schema/**"
      - "scripts/generateSharedSchema.mjs"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "shared-schema/**"
      - "scripts/generateSharedSchema.mjs"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Android build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate shared schema metadata
        run: node scripts/generateSharedSchema.mjs

      - name: Run Kotlin unit tests
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.10"
          arguments: -p android testDebugUnitTest

      - name: Assemble ABI artifacts
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.10"
          arguments: -p android :app:assembleDebug

  instrumented:
    name: Android instrumentation API ${{ matrix.api-level }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.10"
          arguments: -p android :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run Compose instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          script: gradle -p android :app:connectedDebugAndroidTest

  release:
    name: Android signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, instrumented]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/openfinalshell-release.jks"
      - uses: gradle/gradle-build-action@v3
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/openfinalshell-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          gradle-version: "8.10"
          arguments: -p android :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
