name: android-ci

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "shared-schema/**"
      - "scripts/generateSharedSchema.mjs"
      - "src/shared/generated/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
  pull_request:
    paths:
      - "android/**"
      - "shared-schema/**"
      - "scripts/generateSharedSchema.mjs"
      - "src/shared/generated/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.10.2"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  unit:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Generate shared schema metadata
        run: node scripts/generateSharedSchema.mjs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          # GitHub Cache 服务短暂不可用时不应阻断 Android 编译。
          cache-disabled: true

      - name: Check Settings translations and run Kotlin unit tests
        run: gradle -p android :app:checkI18n testDebugUnitTest --stacktrace

      - name: Assemble debug APKs
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Android instrumentation (API ${{ matrix.api_level }})
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api_level: [26, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      - name: Assemble instrumentation APKs
        run: gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM acceleration
        run: |
          sudo groupadd -f kvm
          sudo usermod -aG kvm "$USER"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: gradle -p android :app:connectedDebugAndroidTest --stacktrace --no-daemon --console=plain

      - name: Collect instrumentation diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p android-test-diagnostics
          # The emulator runner may have already stopped adb after a failed test. Bound every
          # diagnostic command so a secondary collection failure cannot hold the CI run open.
          timeout 30s adb logcat -d -t 5000 > android-test-diagnostics/logcat.txt 2>&1 || true
          timeout 15s adb shell getprop > android-test-diagnostics/getprop.txt 2>&1 || true
          test_results=android/app/build/outputs/androidTest-results
          if [[ -d "$test_results" ]]; then
            cp -R "$test_results" android-test-diagnostics/androidTest-results
          fi

      - name: Upload instrumentation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics-api-${{ matrix.api_level }}-${{ github.sha }}
          path: android-test-diagnostics
          if-no-files-found: warn
          retention-days: 14
