name: android-ci

on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "shared-schema/**"
      - "scripts/generateSharedSchema.mjs"
      - "src/shared/generated/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
  pull_request:
    paths:
      - "android/**"
      - "shared-schema/**"
      - "scripts/generateSharedSchema.mjs"
      - "src/shared/generated/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.10.2"
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  # Pinned to the version in android/app/build.gradle.kts. The privileged local-shell tiers need the
  # native PTY host built here, so both the unit and the instrumentation job install it.
  ANDROID_NDK: "27.0.12077973"
  ANDROID_CMAKE: "3.22.1"

jobs:
  unit:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" "ndk;${{ env.ANDROID_NDK }}" "cmake;${{ env.ANDROID_CMAKE }}"
          # :app cannot even configure without these, so a silent no-op install has to fail here
          # rather than surface later as an unrelated-looking Gradle error.
          test -f "$ANDROID_HOME/ndk/${{ env.ANDROID_NDK }}/source.properties" || {
            echo "::error::NDK ${{ env.ANDROID_NDK }} was not installed"; exit 1; }
          test -d "$ANDROID_HOME/cmake/${{ env.ANDROID_CMAKE }}" || {
            echo "::error::CMake ${{ env.ANDROID_CMAKE }} was not installed"; exit 1; }

      - name: Generate shared schema metadata
        run: node scripts/generateSharedSchema.mjs

      - name: Verify generated schema is committed
        run: git diff --exit-code -- src/shared/generated android/core/src/main/kotlin/io/github/openfinalshell/android/core/protocol

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Check UI translations, lint and Kotlin unit tests
        run: gradle -p android :app:checkI18n :app:lintDebug testDebugUnitTest --stacktrace

      - name: Assemble debug APKs
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Validate unsigned release APKs and AAB
        run: gradle -p android :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify all Android ABI outputs
        shell: bash
        run: |
          expected=(arm64-v8a armeabi-v7a x86_64 x86 universal)
          for abi in "${expected[@]}"; do
            apk="android/app/build/outputs/apk/debug/app-$abi-debug.apk"
            [ -f "$apk" ] || { echo "::error::Missing debug APK for ABI $abi"; exit 1; }
          done
          actual=$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name 'app-*-debug.apk' | wc -l)
          [ "$actual" -eq "${#expected[@]}" ] || {
            echo "::error::Expected ${#expected[@]} debug APKs, found $actual"
            exit 1
          }

  instrumentation:
    name: Android instrumentation (API ${{ matrix.api_level }})
    needs: unit
    # 模拟器测试是 PR/手动验收门禁；主分支 push 只保留快速的单元测试和
    # Debug 构建，避免每次合并都重复启动两个冷模拟器。
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api_level: [26, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" "ndk;${{ env.ANDROID_NDK }}" "cmake;${{ env.ANDROID_CMAKE }}"
          # :app cannot even configure without these, so a silent no-op install has to fail here
          # rather than surface later as an unrelated-looking Gradle error.
          test -f "$ANDROID_HOME/ndk/${{ env.ANDROID_NDK }}/source.properties" || {
            echo "::error::NDK ${{ env.ANDROID_NDK }} was not installed"; exit 1; }
          test -d "$ANDROID_HOME/cmake/${{ env.ANDROID_CMAKE }}" || {
            echo "::error::CMake ${{ env.ANDROID_CMAKE }} was not installed"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Assemble instrumentation APKs
        run: gradle -p android :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM acceleration
        run: |
          sudo groupadd -f kvm
          sudo usermod -aG kvm "$USER"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: |
            # Proves the load-bearing half of the privileged local-shell tiers without a Shizuku
            # installation: `adb shell` is uid 2000 on these images, so if the helper executes,
            # allocates a PTY through forkpty and reports 2000, then the same artifact will work as a
            # Shizuku user service or under `su`. This is the only part of those tiers CI can reach.
            helper=android/app/build/intermediates/cmake/debug/obj/x86_64/libofspty.so
            adb push "$helper" /data/local/tmp/libofspty.so
            adb shell chmod 700 /data/local/tmp/libofspty.so
            uid=$(adb shell /data/local/tmp/libofspty.so --self-test | tr -d '\r')
            if [ "$uid" != "2000" ]; then
              echo "::error::ofspty self-test reported '$uid', expected 2000"
              exit 1
            fi
            echo "ofspty self-test reported uid $uid"

            # Then prove the assumption the tiers rest on: that an app-uid process can drive a PTY
            # host at the shell uid over loopback. A SELinux refusal here would sink the whole
            # design, and nothing else in the suite would notice.
            token=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
            adb shell "rm -f /data/local/tmp/ofs-l1.txt; nohup /data/local/tmp/libofspty.so \
              --port 0 --token $token --shell /system/bin/sh --cwd /data/local/tmp \
              --cols 80 --rows 24 > /data/local/tmp/ofs-l1.txt 2>&1 &"
            sleep 3
            port=$(adb shell cat /data/local/tmp/ofs-l1.txt | tr -d '\r' | sed 's/PORT //')
            if [ -z "$port" ]; then
              echo "::error::the staged PTY host reported no port"
              exit 1
            fi
            adb shell am instrument -w -e ofsHostPort "$port" -e ofsHostToken "$token" \
              -e class io.github.openfinalshell.android.local.LocalHostCrossUidInstrumentedTest \
              io.github.openfinalshell.android.test/androidx.test.runner.AndroidJUnitRunner > cross-uid.txt 2>&1
            cat cross-uid.txt
            grep -q "OK (1 test)" cross-uid.txt || {
              echo "::error::the app-uid process could not drive the shell-uid host"
              exit 1
            }

            gradle -p android :app:connectedDebugAndroidTest --stacktrace --no-daemon --console=plain

      - name: Collect instrumentation diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p android-test-diagnostics
          # The emulator runner may have already stopped adb after a failed test. Bound every
          # diagnostic command so a secondary collection failure cannot hold the CI run open.
          timeout 30s adb logcat -d -t 5000 > android-test-diagnostics/logcat.txt 2>&1 || true
          timeout 15s adb shell getprop > android-test-diagnostics/getprop.txt 2>&1 || true
          test_results=android/app/build/outputs/androidTest-results
          if [[ -d "$test_results" ]]; then
            cp -R "$test_results" android-test-diagnostics/androidTest-results
          fi

      - name: Upload instrumentation diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics-api-${{ matrix.api_level }}-${{ github.sha }}
          path: android-test-diagnostics
          if-no-files-found: warn
          retention-days: 14
