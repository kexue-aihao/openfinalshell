appId: io.github.openfinalshell
productName: OpenFinalShell
copyright: Copyright © 2026 openfinalshell contributors

directories:
  output: release
  buildResources: build

files:
  - out/**
  # package.json 必需；其余源码/测试不入包
  - package.json

asar: true
asarUnpack:
  # ssh2 的可选原生 crypto binding / cpu-features 存在时需解包才能 dlopen
  - '**/*.node'

# 针对 Electron ABI 重编原生可选依赖；失败无害（ssh2 自动回退纯 JS）
npmRebuild: true

win:
  # 刻意不写 arch：由命令行 --x64 / --ia32 决定（不给则只出宿主架构）。
  # 一旦在这里写死 arch: [x64, ia32]，命令行标志对安装包目标就会被忽略 ——
  # 每次调用都把两个架构、外加一个双架构合体包全建一遍（实测单个 job 产出 732MB、耗时翻倍）。
  # 注意 `--dir` 验证不出这个问题：它只跑打包、不跑安装包目标。
  target: [nsis, portable]
  # 只提供 512×512 PNG，electron-builder 自动转 ICO
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false # 免管理员，装到 %LOCALAPPDATA%
  # 卸载时一并删除 %APPDATA%\OpenFinalShell（连接、凭据、known_hosts、数据库都在那儿）。
  # 默认 false 会把这些留在磁盘上 —— 卸载后重装还能看到旧数据，既不干净也是隐私问题。
  # 需要保留的话请先用设置页的"导出应用数据"备份。
  deleteAppDataOnUninstall: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenFinalShell
  installerLanguages: [zh_CN, en_US]
  # ${arch} 必须留着：x64 与 ia32 同名会互相覆盖，只剩后构建的那个
  artifactName: ${productName}-${version}-setup-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}

mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true

linux:
  target: [AppImage, deb]
  category: Network
  icon: build/icon.png
  maintainer: openfinalshell contributors

publish:
  provider: github
  owner: kexue-aihao
  repo: openfinalshell
  # 按架构分 channel。**这一行是自动更新能同时服务两个架构的全部前提。**
  #
  # Windows 上 latest.yml 的文件名不带架构后缀 —— app-builder-lib 的
  # out/publish/updateInfoBuilder.js 里 getArchPrefixForUpdateFile() 只对 Linux 加后缀。
  # 于是 x64 与 ia32 两个 job 各写一份**同名** latest.yml，合并上传到同一个 Release
  # 就是静默互相覆盖（download-artifact 的 merge-multiple 后写的赢，gh release 也不报错），
  # 结果是一半用户拿到的 feed 里 sha512 属于另一个架构。
  #
  # publish 配置里的字符串会按架构分别做宏展开（PublishManager.js expandPublishConfig），
  # 所以这一行让两个 job 各写 latest-x64.yml / latest-ia32.yml，
  # 并把对应 channel 烧进各自安装包的 app-update.yml —— 客户端无从挑错。
  #
  # 另一条路是一次调用给两个架构（那样只写一份含两条 file 的 latest.yml），但会额外
  # 产出双架构合体包（见上面 win.target 的注释：732MB、耗时翻倍），不划算；
  # 而且 UpdateFileInfo 结构里没有 arch 字段、排序还把 ia32 排在 x64 前面，
  # 客户端若是"取第一个 exe"，x64 用户会被静默装上 32 位包。
  channel: latest-${arch}
