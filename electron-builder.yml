appId: io.github.openfinalshell
productName: OpenFinalShell
copyright: Copyright © 2026 openfinalshell contributors

directories:
  output: release
  buildResources: build

files:
  - out/**
  # package.json 必需；其余源码/测试不入包
  - package.json

asar: true
asarUnpack:
  # ssh2 的可选原生 crypto binding / cpu-features 存在时需解包才能 dlopen
  - '**/*.node'

# 针对 Electron ABI 重编原生可选依赖；失败无害（ssh2 自动回退纯 JS）
npmRebuild: true

win:
  # 刻意不写 arch：由命令行 --x64 / --ia32 / --arm64 决定（不给则只出宿主架构）。
  # 一旦在这里写死 arch，命令行标志对安装包目标就会被忽略 ——
  # 每次调用都把多个架构、外加一个双架构合体包全建一遍，既慢又会污染发布产物。
  # 注意 `--dir` 验证不出这个问题：它只跑打包、不跑安装包目标。
  target: [nsis, portable]
  # 只提供 512×512 PNG，electron-builder 自动转 ICO
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false # 免管理员，装到 %LOCALAPPDATA%
  # 卸载时一并删除 %APPDATA%\OpenFinalShell（连接、凭据、known_hosts、数据库都在那儿）。
  # 默认 false 会把这些留在磁盘上 —— 卸载后重装还能看到旧数据，既不干净也是隐私问题。
  # 需要保留的话请先用设置页的"导出应用数据"备份。
  deleteAppDataOnUninstall: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenFinalShell
  installerLanguages: [zh_CN, en_US]
  # ${arch} 必须留着：x64、ia32、arm64 同名会互相覆盖，只剩后构建的那个
  artifactName: ${productName}-${version}-setup-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}

mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  # ssh2 的可选 crypto binding 由 npm install 脚本直接用宿主 Node 编译，
  # 在 Apple Silicon runner 上为 x64/universal 构建时会得到同一份宿主架构
  # 二进制。macOS 下 ssh2 会自动回退到纯 JavaScript 实现，因此不把这份
  # 无法可靠跨架构合并的可选 binding 放入发布包。
  files:
    - '!node_modules/ssh2/lib/protocol/crypto/build/**'

linux:
  # arch 始终由命令行的 --x64 / --arm64 指定，避免一个 job 混入多个架构的产物。
  # .deb 保留 Debian 13 原生渠道；rpm 与 AppImage 覆盖其余主流发行版。
  target: [deb, rpm, AppImage, flatpak]
  category: Network
  executableName: openfinalshell
  syncDesktopName: true
  icon: build/icon.png
  maintainer: openfinalshell contributors
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

deb:
  packageCategory: net
  packageName: openfinalshell
  synopsis: SSH terminal, SFTP client and server monitor
  # 依赖项针对 Debian 13，不把它伪装成可直接安装于所有 Debian 系发行版的包。
  artifactName: ${productName}-${version}-debian13-${arch}.${ext}
  # electron-builder 26 的默认包名仍是 Debian 12 时代的非 t64 名称；
  # Debian 13 (Trixie) 必须显式使用这些可解析的运行时依赖。
  depends:
    - libasound2t64
    - libatk-bridge2.0-0t64
    - libatk1.0-0t64
    - libc6
    - libcairo2
    - libcups2t64
    - libdbus-1-3
    - libdrm2
    - libexpat1
    - libgbm1
    - libglib2.0-0t64
    - libgtk-3-0t64
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libudev1
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
    - libxss1
    - libxtst6
    - libnotify4
    - xdg-utils
    - libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
  # 默认的 libappindicator3-1 已不在 Debian 13，且本项目没有托盘功能。
  recommends: []

rpm:
  packageCategory: Applications/Internet
  packageName: openfinalshell
  synopsis: SSH terminal, SFTP client and server monitor

appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

flatpak:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Network
  # electron-builder 的默认 20.08 运行时已停止维护，改用仍受支持的 24.08。
  # Flathub 的 Electron BaseApp 目前仅提供 x86_64，所以 CI 只发布 x64 Flatpak。
  runtimeVersion: '24.08'
  baseVersion: '24.08'

publish:
  provider: github
  owner: kexue-aihao
  repo: openfinalshell
  # 按架构分 channel。**这一行是自动更新能同时服务两个架构的全部前提。**
  #
  # Windows 上 latest.yml 的文件名不带架构后缀 —— app-builder-lib 的
  # out/publish/updateInfoBuilder.js 里 getArchPrefixForUpdateFile() 只对 Linux 加后缀。
  # 于是 x64 与 ia32 两个 job 各写一份**同名** latest.yml，合并上传到同一个 Release
  # 就是静默互相覆盖（download-artifact 的 merge-multiple 后写的赢，gh release 也不报错），
  # 结果是一半用户拿到的 feed 里 sha512 属于另一个架构。
  #
  # publish 配置里的字符串会按架构分别做宏展开（PublishManager.js expandPublishConfig），
  # 所以这一行让两个 job 各写 latest-x64.yml / latest-ia32.yml，
  # 并把对应 channel 烧进各自安装包的 app-update.yml —— 客户端无从挑错。
  #
  # 另一条路是一次调用给两个架构（那样只写一份含两条 file 的 latest.yml），但会额外
  # 产出双架构合体包（见上面 win.target 的注释：732MB、耗时翻倍），不划算；
  # 而且 UpdateFileInfo 结构里没有 arch 字段、排序还把 ia32 排在 x64 前面，
  # 客户端若是"取第一个 exe"，x64 用户会被静默装上 32 位包。
  channel: latest-${arch}
